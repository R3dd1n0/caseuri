<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Felipe &amp; Mariana · Álbum</title>

  <!-- Compartilhamento (WhatsApp / redes) — estático, o scraper não roda JS -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Felipe &amp; Mariana · Álbum do casamento">
  <meta property="og:description" content="Fotos e vídeos do nosso casamento.">
  <meta property="og:image" content="https://felipemariana.com.br/assets/og-casados.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:url" content="https://felipemariana.com.br/fotos/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#481110">

  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fotos.css">
</head>
<body>

  <!-- Topo no mesmo estilo da capa do site; o monograma volta para a página inicial -->
  <header class="topo">
    <a class="topo-mono" href="../" aria-label="Voltar para a página inicial">
      <img src="../assets/monograma-creme.svg" alt="Monograma M F">
    </a>
    <h1 class="topo-titulo">Nosso álbum</h1>

    <!-- Só aparece quando há fotos oficiais visíveis -->
    <nav id="album-origem" class="origem" aria-label="Álbuns" hidden>
      <button class="origem-btn" data-o="oficiais" type="button" aria-pressed="false">Fotos oficiais</button>
      <button class="origem-btn" data-o="convidados" type="button" aria-pressed="false">Dos convidados</button>
    </nav>
  </header>

  <main class="tela">
    <p id="album-espera" class="aviso" hidden>Carregando…</p>

    <!-- ====== FOTOS OFICIAIS (fotógrafo) ====== -->
    <section id="album-oficiais" hidden>
      <div id="oficiais-chips" class="chips"></div>
      <div id="oficiais-grade" class="grade"></div>
    </section>

    <!-- ====== FOTOS DOS CONVIDADOS ====== -->
    <section id="album-convidados" hidden>
      <div class="barra-conv">
        <div class="chips">
          <button class="chip filtro ativa" data-f="todos" type="button">Todos</button>
          <button class="chip filtro" data-f="foto" type="button">Fotos</button>
          <button class="chip filtro" data-f="video" type="button">Vídeos</button>
        </div>
        <button id="btn-enviar" class="btn-enviar" type="button" aria-expanded="false">Enviar</button>
      </div>

      <!-- Envio (abre pelo botão "Enviar") -->
      <div id="pane-enviar" class="cartao" hidden>
        <label class="campo-nome">
          <span>Seu nome <em>(opcional)</em></span>
          <input id="nome" type="text" autocomplete="name">
        </label>
        <button id="btn-add" class="botao" type="button" disabled>Escolher fotos e vídeos</button>
        <input id="arquivo" type="file" accept="image/*,video/*,.heic,.heif,.mov" multiple hidden>
        <p id="aviso" class="aviso" hidden></p>
        <input id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
        <div id="lista" class="lista"></div>
        <div id="resumo" class="resumo" hidden></div>
      </div>

      <div id="grade" class="grade"></div>
      <p id="album-msg" class="aviso">Carregando…</p>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lb" class="lb" hidden>
    <a id="lb-baixar" class="lb-baixar" target="_blank" rel="noopener">Baixar</a>
    <button id="lb-fechar" class="lb-x" type="button" aria-label="Fechar">✕</button>
    <button id="lb-prev" class="lb-nav lb-prev" type="button" aria-label="Anterior">‹</button>
    <div id="lb-media" class="lb-media"></div>
    <button id="lb-next" class="lb-nav lb-next" type="button" aria-label="Próxima">›</button>
    <div id="lb-cap" class="lb-cap"></div>
  </div>

  <script src="fotos-config.js"></script>
  <script src="oficiais.js"></script>
  <script src="fotos.js"></script>
</body>
</html>
