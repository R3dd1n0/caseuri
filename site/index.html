<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><!-- site privado: fora de buscadores -->
  <title>Casamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/base.css">

  <!-- Favicon (ícone da aba) -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">

  <!-- Compartilhamento (WhatsApp / redes) — precisa ser estático, o scraper não roda JS -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Felipe & Mariana">
  <meta property="og:description" content="12 de novembro de 2026 · Confirme sua presença e veja a lista de presentes.">
  <meta property="og:image" content="https://felipemariana.com.br/assets/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:url" content="https://felipemariana.com.br/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#740C23">
</head>
<body>

  <!-- ============ GATE (landing por nome) ============ -->
  <div id="gate" hidden>
    <div class="caixa">
      <img class="monograma" src="assets/monograma.svg" alt="Monograma M F">
      <h1 data-bind="gate.titulo">·</h1>
      <p data-bind="gate.instrucao">·</p>
      <form id="gate-form">
        <input id="gate-nome" class="campo" type="text" autocomplete="name" required>
        <button id="gate-botao" class="botao" type="submit">Entrar</button>
        <div id="gate-msg" class="msg"></div>
      </form>
    </div>
  </div>

  <!-- ============ HUB (conteúdo do site) ============ -->
  <div id="hub">
    <header id="capa" class="capa container">
      <img class="monograma" src="assets/monograma.svg" alt="Monograma M F">
      <h1 data-bind="casal.titulo">·</h1>
      <div id="contagem" class="contagem"></div>
    </header>

    <main class="container">
      <details id="historia" class="secao">
        <summary><span class="secao-titulo" data-bind="secoes.historia.titulo">·</span></summary>
        <div class="secao-corpo">
          <div data-bind-paragrafos="secoes.historia.paragrafos"></div>
          <div id="historia-fotos" class="timeline" aria-label="Linha do tempo com fotos"></div>
        </div>
      </details>

      <details id="quando" class="secao" open>
        <summary><span class="secao-titulo" data-bind="secoes.quandoOnde.titulo">·</span></summary>
        <div class="secao-corpo">
          <p data-bind="secoes.quandoOnde.corpo">·</p>
          <p><strong data-bind="evento.dataTexto">·</strong></p>
          <p data-bind="evento.horario">·</p>
          <p data-bind="evento.local">·</p>
          <p data-bind="evento.endereco">·</p>
          <p class="lembrete" data-bind="secoes.quandoOnde.estacionamento">·</p>
          <p class="acoes">
            <a id="link-maps" class="botao botao--secundario" target="_blank" rel="noopener">Google Maps</a>
            <a id="link-waze" class="botao botao--secundario" target="_blank" rel="noopener">Waze</a>
          </p>
        </div>
      </details>

      <details id="dress" class="secao">
        <summary><span class="secao-titulo" data-bind="secoes.dressCode.titulo">·</span></summary>
        <div class="secao-corpo">
          <p class="dress-destaque" data-bind="secoes.dressCode.destaque">·</p>
          <p data-bind="secoes.dressCode.corpo">·</p>
        </div>
      </details>

      <details id="info" class="secao">
        <summary><span class="secao-titulo" data-bind="secoes.informacoes.titulo">·</span></summary>
        <div class="secao-corpo">
          <p data-bind="secoes.informacoes.corpo">·</p>
        </div>
      </details>

      <!-- ---- RSVP ---- -->
      <details id="rsvp" class="secao">
        <summary><span class="secao-titulo" data-bind="rsvp.titulo">·</span></summary>
        <div class="secao-corpo">
          <p>Convite: <strong id="rsvp-grupo">·</strong></p>
          <form id="rsvp-form">
            <div id="rsvp-pessoas"></div>
            <button class="botao" type="submit">Salvar resposta</button>
            <div id="rsvp-msg" class="msg"></div>
          </form>
          <p id="rsvp-lembrete" class="lembrete" data-bind="rsvp.lembreteSemPresente" hidden>·</p>
        </div>
      </details>

      <!-- ---- Presentes ---- -->
      <details id="presentes" class="secao">
        <summary><span class="secao-titulo" data-bind="presentes.titulo">·</span></summary>
        <div class="secao-corpo">
          <p id="presentes-obrigado" class="msg msg--ok" hidden></p>
          <p data-bind="presentes.intro">·</p>
          <div id="presentes-lista" class="grade-presentes"></div>
          <div id="presentes-msg" class="msg"></div>
        </div>
      </details>

      <!-- ---- Recados + mural ---- -->
      <details id="recados" class="secao">
        <summary><span class="secao-titulo" data-bind="secoes.recados.titulo">·</span></summary>
        <div class="secao-corpo">
          <div data-bind-paragrafos="secoes.recados.paragrafos"></div>
          <form id="recado-form" class="mural">
            <label data-bind="mural.titulo">·</label>
            <input id="recado-nome" class="campo" type="text" autocomplete="name">
            <textarea id="recado-msg" class="campo" rows="3"></textarea>
            <button class="botao" type="submit" data-bind="mural.botao">·</button>
            <div id="recado-status" class="msg"></div>
          </form>
        </div>
      </details>
    </main>

    <footer class="rodape container">
      <a href="#" id="sair">Sair</a>
    </footer>
  </div>

  <!-- ============ Modal PIX ============ -->
  <div id="pix-modal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:1rem;z-index:20;">
    <div style="background:var(--cor-fundo);border-radius:var(--raio);padding:1.2rem;max-width:360px;width:100%;">
      <div id="pix-conteudo"></div>
      <button id="pix-fechar" class="botao botao--secundario" style="margin-top:1rem;width:100%;">Fechar</button>
    </div>
  </div>

  <!-- ============ Lightbox de fotos (linha do tempo) ============ -->
  <div id="foto-modal" class="foto-modal" hidden>
    <button id="foto-fechar" class="foto-x" aria-label="Fechar">✕</button>
    <button id="foto-prev" class="foto-nav" aria-label="Foto anterior">‹</button>
    <figure class="foto-fig">
      <img id="foto-img" alt="Felipe e Mariana">
      <figcaption id="foto-ano"></figcaption>
    </figure>
    <button id="foto-next" class="foto-nav" aria-label="Próxima foto">›</button>
  </div>

  <!-- ordem importa: config e conteúdo antes dos módulos -->
  <script src="config.js"></script>
  <script src="conteudo.js"></script>
  <script src="assets/sessao.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
